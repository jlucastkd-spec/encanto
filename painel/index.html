<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pedidos · Encanto de Brownie</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#24130F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pedidos">
  <link rel="manifest" href="/painel/manifest.webmanifest">
  <link rel="icon" href="/painel/icone-192.png">
  <link rel="apple-touch-icon" href="/painel/icone-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/painel/painel.css">
</head>
<body>

  <!-- ============ LOGIN ============ -->
  <main class="login" data-login hidden>
    <form class="login__card" data-login-form>
      <img src="/painel/icone-192.png" alt="" width="84" height="84">
      <h1>Painel de pedidos</h1>
      <p>Encanto de Brownie</p>
      <label for="senha" class="sr-only">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" placeholder="Senha do painel" required>
      <p class="login__erro" data-login-erro hidden></p>
      <button type="submit" class="pbtn pbtn--primary">Entrar</button>
    </form>
  </main>

  <!-- ============ APP ============ -->
  <div class="app" data-app hidden>
    <header class="top">
      <div class="top__brand">
        <img src="/painel/icone-192.png" alt="" width="36" height="36">
        <div><strong>Pedidos</strong><small data-sync>Atualizando…</small></div>
      </div>
      <div class="top__actions">
        <button type="button" class="icon-btn" data-refresh aria-label="Atualizar">
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4"/></svg>
        </button>
        <button type="button" class="icon-btn" data-menu aria-label="Configurações" aria-expanded="false">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
        </button>
      </div>
    </header>

    <section class="settings" data-settings hidden>
      <h2>Notificações no celular</h2>
      <p data-notif-status>Verificando…</p>
      <p class="settings__ios" data-ios-hint hidden>
        No iPhone: toque em <b>Compartilhar</b> → <b>Adicionar à Tela de Início</b>, abra o painel pelo ícone criado e ative as notificações por lá.
      </p>
      <div class="settings__row">
        <button type="button" class="pbtn pbtn--primary" data-notif-on>Ativar neste aparelho</button>
        <button type="button" class="pbtn" data-notif-test hidden>Enviar teste</button>
        <button type="button" class="pbtn" data-notif-off hidden>Desativar</button>
      </div>
      <div class="settings__row settings__row--split">
        <label class="switch"><input type="checkbox" data-sound checked> Som com o painel aberto</label>
        <button type="button" class="pbtn pbtn--ghost" data-logout>Sair</button>
      </div>
    </section>

    <nav class="tabs" role="tablist" aria-label="Filtrar pedidos">
      <button role="tab" aria-selected="true" data-tab="novos">Novos <span data-count="novos">0</span></button>
      <button role="tab" aria-selected="false" data-tab="andamento">Em andamento <span data-count="andamento">0</span></button>
      <button role="tab" aria-selected="false" data-tab="finalizados">Finalizados <span data-count="finalizados">0</span></button>
    </nav>

    <main class="orders" data-orders aria-live="polite"></main>
    <p class="empty" data-empty hidden></p>
  </div>

  <div class="ptoast" data-toast role="status" aria-live="polite"></div>
  <script src="/painel/painel.js"></script>
</body>
</html>
